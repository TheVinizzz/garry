name: 🍣 feed Garry
description: Feed Garry. Bumps hunger and happiness.
title: "[garry/feed] dinner time"
labels: ["garry", "feed"]
body:
  - type: markdown
    attributes:
      value: "## 🍣 feed Garry"
  - type: dropdown
    id: food
    attributes:
      label: Pick a treat
      options:
        - tuna
        - salmon sashimi
        - chicken
        - dry kibble
        - whipped cream
      default: 0
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: Yes, Garry deserves it.
          required: true
